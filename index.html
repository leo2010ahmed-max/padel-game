/* ─── HELPERS ────────────────────────────────────────────── */

function parseAnalysisJson(text) {
  try {
    const match = text.match(/<analysis>([\s\S]*?)<\/analysis>/);
    if (match) return JSON.parse(match[1].trim());
  } catch(e) {}
  return null;
}

function stripAnalysisTags(text) {
  return text.replace(/<analysis>[\s\S]*?<\/analysis>/g, '').trim();
}

  const pads = { sm: '6px 13px', md: '9px 18px', lg: '12px 26px' };

  const variants = {

/* ─── UPLOAD ZONE ────────────────────────────────────────── */

function openVideoPicker(onFile) {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'video/*';
  inp.style.cssText = 'position:fixed;top:-999px;left:-999px;opacity:0;';
  document.body.appendChild(inp);
  inp.addEventListener('change', () => {
    const f = inp.files[0];
    document.body.removeChild(inp);
    if (f) onFile(f);
  });
  setTimeout(() => inp.click(), 10);
}
window.openVideoPicker = openVideoPicker;

const UploadZone = ({ onAnalyze, profile }) => {
  const [url, setUrl] = React.useState('');
  const [description, setDescription] = React.useState('');
  const [dragOver, setDragOver] = React.useState(false);
  const [step, setStep] = React.useState('idle');
  const [videoFile, setVideoFile] = React.useState(null);
  const [videoBlobUrl, setVideoBlobUrl] = React.useState(null);

  const examples = [
    { title: 'Bandeja technique deep-dive', desc: 'Right-side player, advanced. Contact point and recovery.', tag: 'Technical', prompt: 'Analyze this point: I am a right-side player at advanced level. On shot 3 I attempted a bandeja from the right wall but the ball went long. I think my contact point was late. Please give me a full analysis.' },
    { title: 'Net attack positioning', desc: 'Aggressive net approach after a weak globo return.', tag: 'Tactical', prompt: "Analyze this padel point: After a weak globo from my opponents, I attempted an aggressive net approach. I'm right-handed, playing right side at intermediate-advanced level. The point lasted 6 shots and we eventually lost it at the net." },
    { title: 'Víbora timing fault', desc: 'Common timing fault on the víbora, with drill suggestions.', tag: 'Drills', prompt: "Please analyze this padel point focusing on my víbora timing. I'm right-handed, right side, advanced level. The víbora on shot 4 felt off — I think I was contacting too early and the ball went into the net." },
  ];

  const handleFileSelected = (file) => {
    if (!file || !file.type.startsWith('video/')) return;
    const blobUrl = URL.createObjectURL(file);
    setVideoFile(file);
    setVideoBlobUrl(blobUrl);
    setStep('context');
  };

  const handleAnalyze = (customPrompt) => {
    const fileContext = videoFile ? `The player uploaded a video file: "${videoFile.name}" (${(videoFile.size/1024/1024).toFixed(1)}MB). ` : '';
    const urlContext = url ? `Video URL: ${url}. ` : '';
    const profileContext = `Player profile: ${profile.hand}-handed, ${profile.side}, ${profile.levelShort}. Dominant shots: ${profile.dominantShots}.`;

          onFocus={e => { e.target.style.borderColor = 'rgba(212,175,55,0.6)'; }}

          <Btn variant="primary" size="md" onClick={() => handleAnalyze(description)} disabled={!description.trim()}>Analyze This Point</Btn>
        </div>
      </div>
    );
  }

  return (

      <div className="fade-up d1" style={{ textAlign: 'center' }}>
        <div style={{ fontFamily: "'Cormorant Garamond',serif", fontWeight: 300, fontSize: 48, letterSpacing: '-0.02em', color: '#F0EDE6', lineHeight: 1.15 }}>
          Every point,{' '}
          <span style={{ fontStyle: 'italic', background: 'linear-gradient(90deg,#A8891F,#D4AF37,#E8CC6A,#D4AF37)', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent', backgroundClip: 'text' }}>analyzed.</span>
        </div>
        <div style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 15, color: '#8A8680', marginTop: 10, lineHeight: 1.6 }}>Upload match footage or paste a YouTube link.<br />Your AI padel coach analyzes every shot.</div>
      </div>

      <div className="fade-up d2" style={{ width: '100%', maxWidth: 540 }}>
        <div style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 10, fontWeight: 600, letterSpacing: '0.14em', textTransform: 'uppercase', color: '#5A5854', marginBottom: 8, textAlign: 'center' }}>Upload Your Video</div>
        <div
          className={dragOver ? '' : 'upload-zone-idle'}
          style={{ border: `1.5px dashed ${dragOver ? 'rgba(212,175,55,0.8)' : 'rgba(212,175,55,0.3)'}`, borderRadius: 14, background: dragOver ? 'rgba(212,175,55,0.07)' : 'rgba(212,175,55,0.02)', padding: '32px 28px', textAlign: 'center', cursor: 'pointer', transition: 'all 250ms ease', boxShadow: dragOver ? '0 0 32px rgba(212,175,55,0.2)' : 'none' }}

          onClick={() => openVideoPicker(handleFileSelected)}
        >
          <div style={{ fontSize: 32, color: '#D4AF37', marginBottom: 10 }}>↑</div>

/* ─── VIDEO PLAYER ───────────────────────────────────────── */

const VideoPlayer = ({ keyMoments, videoSrc }) => {
  const videoRef = React.useRef(null);
  const [playing, setPlaying] = React.useState(false);
  const [progress, setProgress] = React.useState(0);
  const [duration, setDuration] = React.useState(0);
  const [currentTime, setCurrentTime] = React.useState(0);
  const [muted, setMuted] = React.useState(false);
  const [src, setSrc] = React.useState(videoSrc || null);
  const [dragOver, setDragOver] = React.useState(false);
  const [showControls, setShowControls] = React.useState(true);
  const hideTimer = React.useRef(null);

  React.useEffect(() => { if (videoSrc) setSrc(videoSrc); }, [videoSrc]);

  React.useEffect(() => {
    if (src && videoRef.current) {
      const saved = localStorage.getItem('aurum_video_time_' + src.substring(0, 40));
      if (saved) videoRef.current.currentTime = parseFloat(saved);
    }
  }, [src]);

  const onTimeUpdate = () => {
    if (!videoRef.current) return;
    const v = videoRef.current;
    const pct = v.duration ? (v.currentTime / v.duration) * 100 : 0;
    setProgress(pct);
    setCurrentTime(v.currentTime);
    localStorage.setItem('aurum_video_time_' + (src || '').substring(0, 40), v.currentTime);
  };

  const onDurationChange = () => {
    if (!videoRef.current) return;
    setDuration(videoRef.current.duration || 0);
  };

  const onEnded = () => setPlaying(false);

  const togglePlay = () => {
    if (!videoRef.current || !src) return;
    if (playing) { videoRef.current.pause(); setPlaying(false); }
    else { videoRef.current.play(); setPlaying(true); }
  };

  const seek = (e) => {
    if (!videoRef.current || !duration) return;
    const r = e.currentTarget.getBoundingClientRect();
    const pct = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
    videoRef.current.currentTime = pct * duration;
    setProgress(pct * 100);
  };

  const seekToTime = (t) => {
    if (!videoRef.current || !duration) return;
    videoRef.current.currentTime = t;
    setProgress((t / duration) * 100);
  };

  const toggleMute = () => {
    if (!videoRef.current) return;
    videoRef.current.muted = !muted;
    setMuted(m => !m);
  };

  const fmt = (secs) => {
    if (!secs || isNaN(secs)) return '0:00';
    const m = Math.floor(secs / 60);
    const s = Math.floor(secs % 60);
    return `${m}:${String(s).padStart(2,'0')}`;
  };

  const handleFile = (file) => {
    if (!file || !file.type.startsWith('video/')) return;
    const url = URL.createObjectURL(file);
    setSrc(url);
    setPlaying(false);
    setProgress(0);
    setCurrentTime(0);
    setDuration(0);
  };

  const handleDrop = (e) => {
    e.preventDefault();
    setDragOver(false);
    handleFile(e.dataTransfer.files[0]);
  };

  const resetHideTimer = () => {
    setShowControls(true);
    clearTimeout(hideTimer.current);
    if (playing) hideTimer.current = setTimeout(() => setShowControls(false), 2500);
  };
  React.useEffect(() => { return () => clearTimeout(hideTimer.current); }, []);
  React.useEffect(() => { if (!playing) setShowControls(true); }, [playing]);

  const overlayVisible = showControls || !playing || !src;

  return (
    <div
      style={{ background: '#000', position: 'relative', width: '100%', aspectRatio: '16/9', flexShrink: 0, overflow: 'hidden', cursor: src ? 'pointer' : 'default' }}
      onMouseMove={resetHideTimer}
      onMouseLeave={() => playing && setShowControls(false)}
    >
      {src && (
        <video
          ref={videoRef}
          src={src}
          style={{ width:'100%', height:'100%', display:'block', objectFit:'contain', background:'#000' }}
          onTimeUpdate={onTimeUpdate}
          onDurationChange={onDurationChange}
          onLoadedMetadata={onDurationChange}
          onEnded={onEnded}
          onPlay={() => setPlaying(true)}
          onPause={() => setPlaying(false)}
          onClick={togglePlay}
          playsInline
        />
      )}

      {!src && (
        <div
          style={{ width:'100%', height:'100%', background:'#0D0D0B', display:'flex', alignItems:'center', justifyContent:'center', flexDirection:'column', gap:12, border: dragOver ? '2px dashed rgba(212,175,55,0.8)' : '2px dashed transparent', boxSizing:'border-box', transition:'border-color 200ms', backgroundImage:'repeating-linear-gradient(0deg,rgba(74,107,82,0.04) 0,rgba(74,107,82,0.04) 1px,transparent 1px,transparent 40px),repeating-linear-gradient(90deg,rgba(74,107,82,0.04) 0,rgba(74,107,82,0.04) 1px,transparent 1px,transparent 40px)' }}
          onDragOver={e => { e.preventDefault(); setDragOver(true); }}
          onDragLeave={() => setDragOver(false)}
          onDrop={handleDrop}
          onClick={() => openVideoPicker(handleFile)}
        >
          <div style={{ width:56,height:56,borderRadius:'50%',background:'rgba(212,175,55,0.1)',border:'1px solid rgba(212,175,55,0.3)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:22,color:'#D4AF37',cursor:'pointer',transition:'all 200ms' }}
            onMouseEnter={e=>e.currentTarget.style.background='rgba(212,175,55,0.2)'}
            onMouseLeave={e=>e.currentTarget.style.background='rgba(212,175,55,0.1)'}>
            ↑
          </div>
          <div style={{ fontFamily:"'DM Sans',sans-serif",fontSize:14,fontWeight:500,color:'#F0EDE6' }}>Drop video here or click to browse</div>
          <div style={{ fontFamily:"'DM Sans',sans-serif",fontSize:12,color:'#8A8680' }}>MP4, MOV, AVI, WebM</div>
          <div style={{ fontFamily:"'DM Sans',sans-serif",fontSize:11,color:'#5A5854',marginTop:4 }}>or use a YouTube URL in the upload screen</div>
        </div>
      )}

      {src && (
        <div style={{ position:'absolute',bottom:0,left:0,right:0,padding:'40px 14px 10px', background:'linear-gradient(to top,rgba(0,0,0,0.9) 0%,transparent 100%)', opacity: overlayVisible ? 1 : 0, transition:'opacity 300ms ease', pointerEvents: overlayVisible ? 'auto' : 'none' }}>
          <div onClick={seek} style={{ width:'100%',height:4,background:'rgba(255,255,255,0.12)',borderRadius:2,position:'relative',cursor:'pointer',marginBottom:10 }}>
            <div style={{ height:'100%',background:'#D4AF37',borderRadius:2,width:`${progress}%`,pointerEvents:'none' }}></div>
            <div style={{ position:'absolute',top:'50%',left:`${progress}%`,transform:'translate(-50%,-50%)',width:13,height:13,borderRadius:'50%',background:'#D4AF37',boxShadow:'0 0 8px rgba(212,175,55,0.6)',pointerEvents:'none' }}></div>
            {keyMoments && duration > 0 && keyMoments.map((km,i) => (
              <div key={i}
                onClick={e => { e.stopPropagation(); seekToTime(km.time); }}
                title={km.label}
                style={{ position:'absolute',top:'50%',left:`${(km.time/duration)*100}%`,transform:'translate(-50%,-50%)',width:9,height:9,borderRadius:'50%',background:km.type==='error'?'#C0392B':'#E8CC6A',boxShadow:km.type==='error'?'0 0 6px rgba(192,57,43,0.7)':'0 0 6px rgba(212,175,55,0.7)',cursor:'pointer',border:'1.5px solid #000',zIndex:3 }}
              ></div>
            ))}
          </div>
          <div style={{ display:'flex',alignItems:'center',gap:8 }}>
            <button onClick={togglePlay} style={{ width:32,height:32,borderRadius:7,background:'rgba(255,255,255,0.12)',border:'none',color:'#F0EDE6',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,flexShrink:0 }}>
              {playing
                ? <span style={{ display:'flex',gap:3 }}><span style={{ width:3,height:16,background:'#F0EDE6',borderRadius:1,display:'block' }}></span><span style={{ width:3,height:16,background:'#F0EDE6',borderRadius:1,display:'block' }}></span></span>
                : <span style={{ width:0,height:0,borderTop:'8px solid transparent',borderBottom:'8px solid transparent',borderLeft:'13px solid #F0EDE6',display:'block',marginLeft:2 }}></span>}
            </button>
            <button onClick={toggleMute} style={{ width:32,height:32,borderRadius:7,background:'rgba(255,255,255,0.12)',border:'none',color:'#F0EDE6',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',fontSize:13,flexShrink:0 }}>
              {muted ? '🔇' : '🔊'}
            </button>
            <span style={{ fontFamily:"'JetBrains Mono',monospace",fontSize:12,color:'#F0EDE6',flexShrink:0 }}>{fmt(currentTime)}</span>
            <span style={{ fontFamily:"'JetBrains Mono',monospace",fontSize:12,color:'rgba(255,255,255,0.35)',flexShrink:0 }}>/</span>
            <span style={{ fontFamily:"'JetBrains Mono',monospace",fontSize:12,color:'rgba(255,255,255,0.5)',flexShrink:0 }}>{fmt(duration)}</span>
            <div style={{ flex:1 }}></div>
            <button onClick={e => { e.stopPropagation(); openVideoPicker(handleFile); }} style={{ fontFamily:"'DM Sans',sans-serif",fontSize:11,fontWeight:600,background:'rgba(255,255,255,0.1)',color:'#B8B4AC',border:'none',borderRadius:6,padding:'5px 10px',cursor:'pointer' }}>
              Change video
            </button>
            <Chip color="gray">HD</Chip>
          </div>
        </div>
      )}

      {src && !playing && duration > 0 && (
        <div onClick={togglePlay} style={{ position:'absolute',top:'50%',left:'50%',transform:'translate(-50%,-50%)',width:64,height:64,borderRadius:'50%',background:'rgba(0,0,0,0.5)',border:'1px solid rgba(212,175,55,0.4)',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',backdropFilter:'blur(4px)',transition:'all 200ms' }}
          onMouseEnter={e=>{ e.currentTarget.style.background='rgba(212,175,55,0.2)'; e.currentTarget.style.boxShadow='0 0 28px rgba(212,175,55,0.3)'; }}
          onMouseLeave={e=>{ e.currentTarget.style.background='rgba(0,0,0,0.5)'; e.currentTarget.style.boxShadow='none'; }}>
          <div style={{ width:0,height:0,borderTop:'12px solid transparent',borderBottom:'12px solid transparent',borderLeft:'20px solid #D4AF37',marginLeft:4 }}></div>
        </div>
      )}
    </div>
  );
};

        {tab==='technical' && renderTechnical()}
        {tab==='tactical'  && renderTactical()}
        {tab==='drills'    && renderDrills()}
      </div>
    </div>
  );
};

/* ─── CHAT COACH (live Claude) ───────────────────────────── */

const ChatCoach = ({ initialContext, profile, analysisReady }) => {
  const systemPrompt = `${SYSTEM_PROMPT}\n\nThe player you're coaching: ${profile.hand}-handed, plays ${profile.side}, level: ${profile.levelShort}. Dominant shots: ${profile.dominantShots}.`;

  const [messages, setMessages] = React.useState([
    { role: 'coach', text: "Analyzing your point now — this takes a moment. I'll have a full breakdown ready shortly. Feel free to ask me anything while you wait." }
  ]);
  const [input, setInput] = React.useState('');
  const [loading, setLoading] = React.useState(false);
  const endRef = React.useRef(null);
  const apiMessages = React.useRef([]);
  const hasWelcomed = React.useRef(false);

  React.useEffect(() => {
    if (initialContext) apiMessages.current = [{ role: 'user', content: initialContext }];
  }, [initialContext]);

  React.useEffect(() => {
    if (analysisReady && !hasWelcomed.current) {
      hasWelcomed.current = true;
      setMessages(m => [...m, { role: 'coach', text: "Analysis is ready — check the Technical, Tactical and Drill tabs on the right. Ask me anything about the point: a specific shot, what you should have done differently, or how to work on these patterns." }]);
    }
  }, [analysisReady]);

  React.useEffect(() => {
    if (endRef.current) {
      const parent = endRef.current.parentElement;
      parent.scrollTop = endRef.current.offsetTop - parent.clientHeight + 80;
    }
  }, [messages, loading]);

  const send = async () => {
    if (!input.trim() || loading) return;
    const userText = input.trim();
    setInput('');
    setMessages(m => [...m, { role:'user', text:userText }]);
    setLoading(true);
    apiMessages.current.push({ role:'user', content:userText });

    try {
      const response = await window.claude.complete({
        messages: apiMessages.current.map(m => ({ role: m.role === 'coach' ? 'assistant' : 'user', content: m.content || m.text })),
        system: systemPrompt,
      });
      const coachText = stripAnalysisTags(response);
      apiMessages.current.push({ role:'assistant', content:coachText });
      setMessages(m => [...m, { role:'coach', text:coachText }]);
    } catch(e) {
      setMessages(m => [...m, { role:'coach', text:"There was an issue reaching AURUM. Please try again." }]);
    }
    setLoading(false);
  };

  const handleKey = e => { if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); } };

  const msgStyle = { maxWidth:'88%' };
  const bubbleBase = { padding:'9px 13px', borderRadius:10, fontFamily:"'DM Sans',sans-serif", fontSize:13, lineHeight:1.6 };

  return (
    <div style={{ display:'flex',flexDirection:'column',borderTop:'1px solid rgba(255,255,255,0.06)',background:'#0A0A08',flexShrink:0 }}>
      <div style={{ padding:'11px 18px',borderBottom:'1px solid rgba(255,255,255,0.06)',display:'flex',alignItems:'center',gap:9 }}>
        <div style={{ width:26,height:26,borderRadius:'50%',background:'linear-gradient(135deg,#D4AF37,#A8891F)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:700,color:'#0A0A08',fontFamily:"'DM Sans',sans-serif",flexShrink:0 }}>A</div>
        <div>
          <div style={{ fontFamily:"'DM Sans',sans-serif",fontSize:13,fontWeight:600,color:'#F0EDE6' }}>Chat with AURUM</div>
          <div style={{ fontFamily:"'DM Sans',sans-serif",fontSize:10,color:'#4A6B52' }}>● Live AI coach</div>
        </div>
      </div>
      <div style={{ padding:'12px 16px',display:'flex',flexDirection:'column',gap:9,maxHeight:200,overflowY:'auto' }}>
        {messages.map((m,i) => (
          <div key={i} style={{ ...msgStyle, alignSelf:m.role==='coach'?'flex-start':'flex-end' }}>
            <div style={{ fontFamily:"'DM Sans',sans-serif",fontSize:10,fontWeight:600,letterSpacing:'0.03em',marginBottom:3,color:m.role==='coach'?'#D4AF37':'#8A8680',textAlign:m.role==='coach'?'left':'right' }}>{m.role==='coach'?'AURUM':'You'}</div>
            <div style={{ ...bubbleBase, ...(m.role==='coach'?{background:'#1A1A17',color:'#F0EDE6',borderBottomLeftRadius:3}:{background:'rgba(212,175,55,0.12)',color:'#F0EDE6',border:'1px solid rgba(212,175,55,0.2)',borderBottomRightRadius:3}) }}>{m.text}</div>
          </div>
        ))}
        {loading && (
          <div style={{ ...msgStyle, alignSelf:'flex-start' }}>
            <div style={{ fontFamily:"'DM Sans',sans-serif",fontSize:10,fontWeight:600,color:'#D4AF37',marginBottom:3 }}>AURUM</div>
            <div style={{ ...bubbleBase,background:'#1A1A17',color:'#F0EDE6',borderBottomLeftRadius:3,display:'flex',gap:4,alignItems:'center' }}>
              {[1,2,3].map(n=><span key={n} style={{ display:'inline-block',width:5,height:5,borderRadius:'50%',background:'#D4AF37' }} className={`typing-${n}`}></span>)}
            </div>
          </div>
        )}
        <div ref={endRef}></div>
      </div>
      <div style={{ display:'flex',gap:8,padding:'10px 14px',borderTop:'1px solid rgba(255,255,255,0.06)' }}>
        <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={handleKey} placeholder="Ask AURUM a question…"
          style={{ flex:1,background:'#1A1A17',border:'1px solid rgba(255,255,255,0.1)',borderRadius:8,padding:'9px 12px',fontFamily:"'DM Sans',sans-serif",fontSize:13,color:'#F0EDE6',outline:'none',transition:'border-color 200ms' }}
          onFocus={e=>{e.target.style.borderColor='rgba(212,175,55,0.6)';}}
          onBlur={e=>{e.target.style.borderColor='rgba(255,255,255,0.1)';}}
          disabled={loading}
        />
        <Btn variant="primary" size="sm" onClick={send} disabled={loading || !input.trim()}>Send</Btn>
      </div>
    </div>
  );
};

/* ─── ANALYSIS VIEW ──────────────────────────────────────── */

const AnalysisView = ({ analysisData, analysisLoading, prompt, profile, videoSrc }) => {
  const [isMobileTab, setMobileTab] = React.useState('analysis');

  return (
    <div style={{ display:'flex',flex:1,overflow:'hidden' }} className="mobile-stack">
      <div className="mobile-only" style={{ position:'fixed',bottom:0,left:0,right:0,background:'rgba(10,10,8,0.95)',borderTop:'1px solid rgba(255,255,255,0.08)',display:'flex',zIndex:50 }}>
        {['video','analysis'].map(t => (
          <button key={t} onClick={()=>setMobileTab(t)} style={{ flex:1,padding:'12px',fontFamily:"'DM Sans',sans-serif",fontSize:13,fontWeight:600,background:'transparent',border:'none',color:isMobileTab===t?'#D4AF37':'#8A8680',cursor:'pointer',textTransform:'capitalize',transition:'color 200ms',borderTop:isMobileTab===t?'2px solid #D4AF37':'2px solid transparent' }}>
            {t === 'video' ? 'Video' : 'Analysis'}
          </button>
        ))}
      </div>

      <div style={{ display:'flex',flexDirection:'column',flex:'0 0 58%',overflow:'hidden',borderRight:'1px solid rgba(255,255,255,0.06)' }} className={`mobile-full ${isMobileTab !== 'video' ? 'desktop-only' : ''}`}>
        <div style={{ padding:'10px 18px',borderBottom:'1px solid rgba(255,255,255,0.06)',display:'flex',alignItems:'center',gap:10,flexShrink:0 }}>
          <div style={{ flex:1 }}>
            <div style={{ display:'flex', alignItems:'center', gap:8 }}>
              <div style={{ fontFamily:"'DM Sans',sans-serif",fontSize:13,fontWeight:600,color:'#F0EDE6' }}>Match Point Analysis</div>
              {analysisLoading && (
                <div style={{ display:'flex', alignItems:'center', gap:5 }}>
                  <div style={{ width:14,height:14,borderRadius:'50%',border:'1.5px solid rgba(212,175,55,0.2)',borderTopColor:'#D4AF37',animation:'spin 0.9s linear infinite' }}></div>
                  <span style={{ fontFamily:"'DM Sans',sans-serif",fontSize:11,color:'#D4AF37' }}>Analyzing…</span>
                </div>
              )}
            </div>
            <div style={{ fontFamily:"'DM Sans',sans-serif",fontSize:11,color:'#8A8680' }}>Just now · {profile.name} · {profile.side} · {profile.levelShort}</div>
          </div>
          <Btn variant="secondary" size="sm">Export PDF</Btn>
        </div>
        <VideoPlayer keyMoments={KEY_MOMENTS_DEFAULT} videoSrc={videoSrc} />
        <ChatCoach initialContext={prompt} profile={profile} analysisReady={!!analysisData} />
      </div>

      <div style={{ flex:1,display:'flex',flexDirection:'column',overflow:'hidden',background:'#0D0D0B' }} className={`mobile-full ${isMobileTab !== 'analysis' ? 'desktop-only' : ''}`}>
        <AnalysisPanel analysis={analysisData} loading={analysisLoading} />
      </div>
    </div>
  );
};

/* ─── ROOT APP ───────────────────────────────────────────── */

const App = () => {
  const [view, setView] = React.useState('upload');
  const [sidebarCollapsed, setSidebarCollapsed] = React.useState(false);
  const [analysisData, setAnalysisData] = React.useState(null);
  const [analysisLoading, setAnalysisLoading] = React.useState(false);
  const [prompt, setPrompt] = React.useState('');
  const [videoSrc, setVideoSrc] = React.useState(null);
  const profile = PLAYER_PROFILE_DEFAULT;

  const systemPromptFull = `${SYSTEM_PROMPT}\n\nThe player you're coaching: ${profile.hand}-handed, plays ${profile.side}, level: ${profile.levelShort}. Dominant shots: ${profile.dominantShots}.`;

  const handleAnalyze = async (userPrompt, blobUrl) => {
    setView('analysis');
    setAnalysisLoading(true);
    setAnalysisData(null);
    setPrompt(userPrompt);
    if (blobUrl) setVideoSrc(blobUrl);

    try {
      const response = await window.claude.complete({
        messages: [{ role:'user', content: userPrompt }],
        system: systemPromptFull,
      });
      const parsed = parseAnalysisJson(response);
      setAnalysisData(parsed || MOCK_ANALYSIS);
    } catch(e) {
      setAnalysisData(MOCK_ANALYSIS);
    }
    setAnalysisLoading(false);
  };

  const handleSessionOpen = (session) => {
    setAnalysisData(MOCK_ANALYSIS);
    setPrompt(`Revisiting session: ${session.title}. ${session.summary}`);
    setView('analysis');
  };

  return (
    <div style={{ height:'100vh',display:'flex',flexDirection:'column',overflow:'hidden' }}>
      <Header view={view} onNav={setView} onNewSession={() => { setView('upload'); setAnalysisData(null); }} />
      <div style={{ display:'flex',flex:1,overflow:'hidden',marginTop:58 }}>
        {view === 'analysis' && (
          <ProfileSidebar profile={profile} collapsed={sidebarCollapsed} onToggle={() => setSidebarCollapsed(c => !c)} />
        )}
        <div style={{ flex:1,display:'flex',flexDirection:'column',overflow:'hidden' }}>
          {view === 'upload'   && <UploadZone onAnalyze={handleAnalyze} profile={profile} />}
          {view === 'sessions' && <SessionsScreen onOpen={handleSessionOpen} />}
          {view === 'analysis' && <AnalysisView analysisData={analysisData} analysisLoading={analysisLoading} prompt={prompt} profile={profile} videoSrc={videoSrc} />}
        </div>
      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
